# =================================================================
# GENERAL BEHAVIOR
# =================================================================
no-input-default-bindings               # Disable all built-in keybindings (input.conf handles everything)
keep-open=always                        # Stay on last frame of EVERY file (keep-open=yes only holds on last playlist item)
idle=yes                                # Keep player open when a file fails to load
msg-level=ffmpeg=error                  # Suppress ffmpeg warnings, keep mpv warnings visible
# save-position-on-quit=yes              # Remember playback position on exit (resume watching)
input-ipc-server=\\.\pipe\mpv-pipe      # Enable IPC for single-instance control

# =================================================================
# WINDOW & DISPLAY
# =================================================================
fullscreen=no                           # Start in window mode
geometry=50%:50%                        # Open centered on screen
autofit-larger=70%x70%                  # Max window size relative to monitor
window-corners=round                    # Rounded corners (Windows 11+)

# =================================================================
# VIDEO, GPU & HDR TONE-MAPPING
# =================================================================
vo=gpu-next                             # Modern rendering engine with full HDR pipeline support
gpu-api=d3d11                           # Best API on Windows
hwdec=auto-safe                         # Automatically select the best hardware decoder (fallback safely)
                                        # Switch to d3d11va-copy if you use vf= filters

# --- Smooth Playback ---
# FIX: video-sync=audio is used as the BASE for ALL content, including streams.
# display-resample on a network stream causes stutter when the buffer has any
# hiccup — the interpolator needs TWO frames ready; a momentary buffer drain
# means the next frame isn't available, producing a visible freeze.
# The [local-hq] profile below re-enables display-resample + interpolation
# automatically for local disk files where the buffer never runs dry.
video-sync=audio                        # Safe base: no audio resampling overhead on streams
interpolation=no                        # OFF by default; re-enabled for local files via [local-hq]

tscale=oversample                       # Pre-declare tscale so [local-hq] can toggle interpolation on
                                        # without needing to also set tscale each time

# --- Scaling ---
scale=spline36                          # High quality upscale, much lighter than ewa_lanczossharp
dscale=mitchell                         # Good downscale quality, lightweight
cscale=mitchell                         # Chroma upscale — mitchell is indistinguishable from spline36 on 4:2:0 chroma
correct-downscaling=yes                 # Prevents aliasing when video is larger than window
sigmoid-upscaling=yes                   # Reduces ringing on upscaled content
deband=yes                              # Remove banding artifacts (worth keeping, low cost)

# --- HDR ---
target-colorspace-hint=yes              # Pass display colorspace hint to OS for correct HDR signaling
tone-mapping=bt.2390                    # HDR-to-SDR: perceptually accurate EETF curve (industry standard)
hdr-compute-peak=no                     # Disabled — causes stutters, not useful for SDR YouTube content

# =================================================================
# NETWORK & YT-DLP
# =================================================================
ytdl-format=bestvideo[vcodec^=av01]+bestaudio[acodec^=opus]/bestvideo[vcodec^=vp9]+bestaudio[acodec^=opus]/bestvideo+bestaudio/best
ytdl-raw-options-append=no-playlist=

# If you have YouTube Premium, uncomment one of the following lines
# to pass your browser cookies to yt-dlp. Without this, premium_toggle.lua
# will APPEAR to activate but silently fall back to standard bitrate streams.
# ytdl-raw-options-append=cookies-from-browser=chrome
ytdl-raw-options-append=cookies-from-browser=firefox
# ytdl-raw-options-append=cookies-from-browser=edge

# =================================================================
# NETWORK CACHE
# =================================================================
cache=yes
demuxer-max-bytes=150MiB                # Forward buffer — 150MiB is sufficient for stable 1080p streaming
demuxer-max-back-bytes=75MiB            # Back buffer — 75MiB prevents RAM bloat while keeping rewind snappy
cache-pause=yes                         # Pause cleanly when buffer runs dry instead of freezing

# =================================================================
# CACHE PATHS (Using absolute path to avoid OneDrive sync lag)
# =================================================================
demuxer-cache-dir="C:\mpv-cache"
# BUG FIX: Moved out of portable_config to prevent OneDrive from constantly syncing.
gpu-shader-cache-dir="C:\mpv-cache\gpu-shaders"
# Note: demuxer cache is small, but shader cache can be hundreds of files.
# Moving shader cache out of OneDrive is the priority.

# =================================================================
# AUDIO
# =================================================================
audio-normalize-downmix=yes             # Prevent volume blow-out when downmixing 5.1 surround to stereo
volume-max=150                          # Allow up to 150% volume for quiet content

# =================================================================
# SUBTITLES
# =================================================================
sub-auto=fuzzy                          # Auto-load subtitle files with similar filenames (not just exact matches)
sub-font="Montserrat ExtraBold"         # Match OSD font for visual consistency
sub-font-size=42                        # Comfortable reading size
sub-border-size=2.5                     # Clean outline
sub-color="#FFFFFFFF"
sub-border-color="#FF000000"

# =================================================================
# ON-SCREEN DISPLAY (OSD) TEXT
# =================================================================
osd-font="Montserrat ExtraBold"         # Custom system font
osd-font-size=25                        # Text size
osd-color="#FFFFFFFF"                   # White text
osd-border-color="#FF000000"            # Black outline
osd-border-size=2                       # Outline thickness
osd-align-x=right                       # Horizontal position (right side, away from title)
osd-align-y=bottom                      # Vertical position
osd-margin-x=15                         # Horizontal margin
osd-margin-y=90                         # Push up above Tethys control bar

# Show media title on file load — shows video title for streams, filename for local files
osd-playing-msg="${media-title}"
osd-playing-msg-duration=2500

# =================================================================
# LOSSLESS SCREENSHOTS
# =================================================================
screenshot-format=png                   # Lossless PNG
screenshot-high-bit-depth=yes           # Preserve full color depth
screenshot-png-compression=3            # Level 3 is fast with good compression
screenshot-directory=~~/screenshots     # Portable path — saves next to portable_config/
screenshot-template="%F-%wHh%wMm%wSs"  # Filename: VideoName-HHhMMmSSs

# =================================================================
# TETHYS UI PREREQUISITES
# =================================================================
osc=no                                  # Disable default built-in OSC (replaced by osc_tethys.lua)
osd-bar=no                              # Disable default volume/seek bar (Tethys draws its own)
border=no                               # Remove window title bar for clean borderless look

# =================================================================
# PERFORMANCE PROFILES
# =================================================================

# --- Local file quality profile (activates automatically for non-network files) ---
# This re-enables the full quality pipeline that is intentionally OFF in the base
# config. Base keeps interpolation=no / video-sync=audio for stream safety.
# Network streams have variable buffer timing — interpolation needs two frames
# ready simultaneously; any buffer hiccup causes a visible stall. Local files
# read from disk at memory speed so the buffer never runs dry: safe to enable.
[local-hq]
profile-cond=not get("demuxer-via-network", false)
profile-restore=copy
video-sync=display-resample             # Eliminate micro-stutter on 24fps/60Hz mismatch
interpolation=yes                       # Frame timing interpolation — safe on local files
tscale=oversample                       # Lightest interpolation: no ghosting, near-zero GPU cost

# --- Auto 4K profile (activates automatically for any video >= 3840px wide) ---
[4k]
profile-cond=get("video-params/w", 0) >= 3840  # Prevent nil crash on file transition
profile-restore=copy                           # Restore base settings when switching to a non-4K file
scale=bilinear                                 # No upscaling needed at native 4K — bilinear is free
dscale=bilinear
cscale=bilinear                                # Chroma is already full-res at 4K, no need for mitchell
correct-downscaling=no
sigmoid-upscaling=no
interpolation=no                               # No interpolation needed at native 4K — GPU saving
deband=no                                      # Most 4K sources (HEVC/AV1) don't need debanding; big GPU saving

# --- Manual fast profile (Alt+p) ---
# NOTE: Intentionally avoids profile=low-latency — that built-in sets cache=no
#       which would destroy the demuxer buffer mid-stream. Options are explicit here.
# NOTE: vd-lavc-threads is intentionally omitted — it only affects the software
#       decoder (lavc). With hwdec=d3d11va active, it has zero effect. It was
#       dead code in the previous version of this profile.
[fast]
profile-restore=copy-equal              # Enables: apply-profile fast revert (Alt+Shift+p to escape)
cache=yes                               # Explicitly keep cache alive (low-latency profile kills this)
video-sync=audio                        # FIX: override display-resample from [local-hq] if active
deband=no                               # Disable debanding
interpolation=no                        # Disable frame interpolation
scale=bilinear                          # Fast bilinear scaling
dscale=bilinear                         # Fast downscale
cscale=bilinear                         # Fast chroma scale
correct-downscaling=no
sigmoid-upscaling=no