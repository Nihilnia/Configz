# =================================================================
# SEEKING & NAVIGATION
# =================================================================
RIGHT           no-osd seek  1 ; script-message show-seek-osd
LEFT            no-osd seek -1 ; script-message show-seek-osd

# YouTube-Style Percentage Jumps (Numpad)
KP0             seek  0 absolute-percent ; show-text "Jump to: 0%"
KP1             seek 10 absolute-percent ; show-text "Jump to: 10%"
KP2             seek 20 absolute-percent ; show-text "Jump to: 20%"
KP3             seek 30 absolute-percent ; show-text "Jump to: 30%"
KP4             seek 40 absolute-percent ; show-text "Jump to: 40%"
KP5             seek 50 absolute-percent ; show-text "Jump to: 50%"
KP6             seek 60 absolute-percent ; show-text "Jump to: 60%"
KP7             seek 70 absolute-percent ; show-text "Jump to: 70%"
KP8             seek 80 absolute-percent ; show-text "Jump to: 80%"
KP9             seek 90 absolute-percent ; show-text "Jump to: 90%"

Alt+r           cycle-values loop-file "inf" "no" ; show-text "Loop: ${?loop-file==inf:ON}${!loop-file==inf:OFF}"
Alt+j           script-message-to console type "set time-pos "

# =================================================================
# PLAYLIST NAVIGATION
# =================================================================
>               script-message yt-channel-next
<               playlist-prev ; show-text "Previous: ${playlist-pos-1}/${playlist-count}"

# =================================================================
# PLAYBACK SPEED & FRAME STEPPING
# =================================================================
Alt+RIGHT       frame-step ; show-text "Next Frame"
Alt+LEFT        frame-back-step ; show-text "Previous Frame"

Alt+UP          add speed  0.1 ; show-text "Speed: ${speed}x"
Alt+DOWN        add speed -0.1 ; show-text "Speed: ${speed}x"
Alt+BS          set speed  1.0 ; show-text "Speed Reset: 1.0x"

# =================================================================
# VOLUME CONTROLS
# =================================================================
WHEEL_UP        no-osd add volume  1 ; script-message show-volume-osd
WHEEL_DOWN      no-osd add volume -1 ; script-message show-volume-osd
UP              no-osd add volume  1 ; script-message show-volume-osd
DOWN            no-osd add volume -1 ; script-message show-volume-osd
m               cycle mute           ; script-message show-volume-osd
M               cycle mute           ; script-message show-volume-osd

# =================================================================
# VOLUME OSD POSITION
# =================================================================
Ctrl+UP         script-message-to volume_osd set-volume-osd-position top
Ctrl+RIGHT      script-message-to volume_osd set-volume-osd-position right
Ctrl+DOWN       script-message-to volume_osd set-volume-osd-position bottom
Ctrl+LEFT       script-message-to volume_osd set-volume-osd-position left

# =================================================================
# AUDIO & SUBTITLES
# =================================================================
a               cycle audio ; show-text "Audio Track: ${audio}"
c               cycle sub-visibility ; show-text "Subtitles: ${?sub-visibility==yes:ON}${!sub-visibility==yes:OFF}"
j               cycle sub ; show-text "Subtitle Track: ${sid}"
Alt+q           script-binding quality_menu/video_formats_toggle
Alt+w           script-binding quality_menu/audio_formats_toggle

# Subtitle sync  (Alt+z / Alt+x nudge ±0.1s  |  Alt+Z resets)
Alt+z           add sub-delay  -0.1 ; show-text "Sub delay: ${sub-delay}s"
Alt+x           add sub-delay   0.1 ; show-text "Sub delay: ${sub-delay}s"
Alt+Z           set sub-delay   0   ; show-text "Sub delay: reset"

# Audio sync  (Ctrl+z / Ctrl+x nudge ±0.1s  |  Ctrl+Z resets)
Ctrl+z          add audio-delay -0.1 ; show-text "Audio delay: ${audio-delay}s"
Ctrl+x          add audio-delay  0.1 ; show-text "Audio delay: ${audio-delay}s"
Ctrl+Z          set audio-delay  0   ; show-text "Audio delay: reset"

# =================================================================
# CHAPTER NAVIGATION & A-B LOOP
# =================================================================
PGUP            add chapter  1 ; show-text "Chapter: ${chapter}"
PGDWN          add chapter -1 ; show-text "Chapter: ${chapter}"

# A-B loop: first press sets A, second sets B and starts loop, third clears
Alt+l           ab-loop ; show-text "A-B: ${ab-loop-a}  →  ${ab-loop-b}"

# =================================================================
# DISPLAY & WINDOW CONTROL
# =================================================================
SPACE           cycle pause
q               quit
Q               quit
ENTER           cycle fullscreen
KP_ENTER        cycle fullscreen
f               cycle fullscreen
F               cycle fullscreen
ESC             set fullscreen no

i               script-binding stats/display-stats-toggle
I               script-binding stats/display-stats-toggle
Alt+o           cycle ontop ; show-text "Always on Top: ${?ontop==yes:ON}${!ontop==yes:OFF}"
p               script-message-to pip_manager pip-managed
P               script-message-to pip_manager pip-managed
Alt+t           cycle border
Alt+s           screenshot ; show-text "Screenshot saved"

# =================================================================
# PERFORMANCE
# =================================================================
# Alt+h: Toggle hardware decoding — shows ACTIVE decoder, not just config value
Alt+h           cycle-values hwdec "d3d11va" "no" ; show-text "HWDec: ${hwdec-current}"

# Alt+p: Apply fast/performance profile
# Alt+Shift+p: Revert back to quality settings (requires profile-restore=copy-equal in mpv.conf [fast] block)
Alt+p           apply-profile fast
Alt+P           apply-profile fast restore

# F5: Live diagnostic — shows actual active renderer and decoder
F5              show-text "${mpv-version} | vo: ${current-vo} | hwdec: ${hwdec-current}" 4000

# =================================================================
# SCRIPTS & EXTERNAL TOOLS
# =================================================================
Alt+e           script-message-to rgx_enhance rgx-toggle
Alt+y           script-message-to premium_toggle premium-toggle
t               script-message thumbnail-toggle
T               script-message thumbnail-toggle

# NOTE: Paths below are hardcoded. Update if settingsNDSync folder moves.
Ctrl+j          script-binding ytdlp_download/download_current
Alt+KP4         run "cmd.exe" "/c" "C:/settingsNDSync/yt-DLP/mpv_download_silent.bat" "${path}" ; show-text "↓ Downloading (minimized)…"
Ctrl+v          script-message clipboard-paste

# =================================================================
# UI & MENUS
# =================================================================
MBTN_RIGHT      script-binding osc_tethys/menu
MBTN_LEFT_DBL   cycle fullscreen

F6              script-message-to toggle_1080p toggle-res-menu
F7    show-text "Video: ${video-codec} | ${video-params/w}×${video-params/h} | ${video-format}  ||  Audio: ${audio-codec} | ${audio-params/samplerate}Hz" 5000

Ctrl+d          script-binding ytdlp_download/download_current
Ctrl+h          script-binding history_menu/show_history

F12 script-binding console/enable
Ctrl+Shift+DEL  script-binding history_menu/history_clear_all
