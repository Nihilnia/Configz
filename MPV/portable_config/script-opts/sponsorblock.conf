# =================================================================
# SPONSORBLOCK SETTINGS
# =================================================================
# Script: portable_config/scripts/sponsorblock.lua
# Docs:   https://github.com/po5/mpv_sponsorblock
# =================================================================

# Categories to FETCH from the API (superset of what you skip)
categories=sponsor,intro,outro,interaction,selfpromo,filler

# Categories to SKIP automatically (subset of categories above)
skip_categories=sponsor,intro,outro,interaction,selfpromo

# API server
server_address=https://sponsor.ajay.app

# =================================================================
# BEHAVIOR
# =================================================================

# Only skip each segment once per video session (not on repeat seeks)
skip_once=yes

# Minimum segment length in seconds — ignore very short segments
min_duration=2

# Create chapter markers at segment boundaries (visible on Tethys seekbar)
make_chapters=yes

# Report views to help the community database
report_views=yes

# Auto-upvote DISABLED — passively upvoting every skipped segment can inflate
# scores for bad/inaccurate submissions. Upvote manually if you vet segments.
auto_upvote=no

# Privacy: Length of SHA256 prefix sent to server (3–32).
# 4 = maximum privacy, slightly fewer cache hits — acceptable tradeoff
sha256_length=4
