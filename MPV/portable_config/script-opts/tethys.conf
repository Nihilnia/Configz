# =================================================================
# TETHYS UI CONFIGURATION
# =================================================================
# Script: portable_config/scripts/osc_tethys.lua
# Docs:   https://github.com/Zren/mpv-osc-tethys
#
# NOTE: showwindowed / showfullscreen / hidetimeout belong in
#   script-opts/osc.conf (the osc namespace), not here.
# =================================================================

# =================================================================
# BEHAVIOR
# =================================================================

# Skip amount for the back/forward buttons (seconds)
skipBy=5

# Skip amount on Right-Click of the skip buttons
skipByMore=30

# Seek mode: "exact" or "relative+keyframes"
# relative+keyframes = fast keyframe snapping — preferred for streams and compressed video
# exact = frame-accurate but slow on HEVC/AV1; only useful if precision on UI buttons matters
skipMode=relative+keyframes

# Show tooltips on hover — disabled: no-input-default-bindings means Tethys hint text
# would reflect mpv defaults, not your actual custom binds, which is misleading
showShortcutTooltip=no

# Show chapter name above the timestamp in the seekbar tooltip
showChapterTooltip=yes

# Show the Picture-in-Picture button
showPictureInPictureButton=yes

# Show the playback speed button
showSpeedButton=yes

# =================================================================
# SIZE
# =================================================================
# Default: 64. This is the dominant height driver.
controlsHeight=48

# Default: 20. The seek strip above the controls bar.
seekbarHeight=16

# Default: 42 (controlsHeight * 2/3). Back/forward skip buttons.
smallButtonSize=32

# Default: 36 (controlsHeight / 2). Audio/sub track buttons.
trackButtonSize=28

# Default: 27. Timestamp left/right of seekbar.
timecodeSize=21

# Default: 20. Cache label text.
cacheTextSize=16

# Default: 20. Hover tooltip text.
buttonTooltipSize=16

# =================================================================
# PICTURE-IN-PICTURE
# =================================================================
# Sets PiP to 33% screen width, 10 pixels from the bottom right
pipGeometry=33%-10-10

# Show PiP window on all virtual desktops
pipAllWorkspaces=yes
