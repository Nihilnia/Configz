unbindall                                // Clear all existing key binds before setting new ones
name "Nihil"                             // Player name

// ============================================
// CORE MOVEMENT & JUMP BINDS
// ============================================
bind "w"            "+forward"           // Move forward
bind "a"            "+left"              // Move left
bind "s"            "+back"              // Move backward
bind "d"            "+right"             // Move right
bind "CTRL"         "+duck"              // Crouch
bind "SHIFT"        "+sprint"            // Walk (slower movement)
bind "SPACE"        "+jump"              // Jump

option_duck_method "0"                   // Duck method (0 = hold to crouch)
option_speed_method "0"                  // Speed method (0 = hold to walk)

// ============================================
// WEAPON & UTILITY SELECTION BINDS
// ============================================
bind "1"            "slot1"              // Primary weapon slot
bind "2"            "slot2"              // Secondary weapon slot
bind "3"            "slot3"              // Knife/melee weapon slot
bind "4"            "slot6"              // HE grenade slot
bind "5"            "slot5"              // Bomb/C4 slot
bind "z"            "slot7"              // Flashbang slot
bind "c"            "slot8"              // Smoke grenade slot
bind "j"          "slot9"              // Decoy grenade slot
bind "x"            "slot10"             // Molotov
bind "q"            "lastinv"            // Switch to last used weapon
bind "e"            "+use"               // Interact with objects (defuse, pick up, open doors)

alias cycleNades "slot6; slot7; slot8; slot9; slot10" // Cycles through all grenade slots
alias +spamDrop "cycleNades; drop"                    // Drops all grenades rapidly when held
alias -spamDrop ""                                    // Releases the spam drop action
bind "h" "+spamDrop"                                  // Hold H to spam-drop all grenades

// ============================================
// ACTION & INSPECT BINDS
// ============================================
bind "r"            "+reload"            // Reload weapon (Contextual bind fallback)
bind "f"            "+lookatweapon"      // Inspect weapon
bind "g"            "drop"               // Drop current weapon
bind "v"            "switchhands"        // Switch weapon to left/right hand

// ============================================
// MOUSE & SENSITIVITY
// ============================================
bind "MOUSE1"       "+attack"            // Primary fire
bind "MOUSE2"       "+attack2"           // Secondary fire/zoom
bind "MOUSE_X"      "yaw"                // Mouse horizontal movement
bind "MOUSE_Y"      "pitch"              // Mouse vertical movement

sensitivity "1"                          // Mouse sensitivity multiplier
m_pitch "0.022"                          // Mouse vertical sensitivity
m_yaw "0.022"                            // Mouse horizontal sensitivity

// ============================================
// VIEWMODEL SETTINGS
// ============================================
viewmodel_fov "68"                       // Field of view for weapon viewmodel
viewmodel_offset_x "2"                   // Horizontal viewmodel position
viewmodel_offset_y "2"                   // Forward/backward viewmodel position
viewmodel_offset_z "-1"                  // Vertical viewmodel position
viewmodel_presetpos "0"                  // Viewmodel preset position (0 = custom)
cl_prefer_lefthanded true                // Sets the players weapon to be held in the left hand

// ============================================
// CROSSHAIR SETTINGS
// ============================================
crosshair "1"                            // Enable crosshair display
cl_crosshair_t false                     // T-style crosshair (0 = disabled)
cl_crosshairusealpha true                // Enables the use of alpha transparency for the crosshair
cl_crosshair_friendly_warning 0          // Disables the warning when aiming at teammates
cl_show_observer_crosshair 2             // Show everyones crosshair

// Sniper Settings
cl_crosshair_sniper_width "1"            // Width of sniper scope crosshair
cl_sniper_show_inaccuracy false          // Hides the inaccuracy indicator on sniper scopes
cl_ironsight_usecrosshaircolor true      // Uses the custom crosshair color when aiming down sights
cl_sniper_auto_rezoom "1"                // Auto re-zoom after firing a sniper rifle
cl_sniper_delay_unscope "0"              // No delay when unscoping sniper rifles

cl_silencer_mode "0"                     // Disable silencer unequip with right click

// ============================================
// CROSSHAIR SHAPE & COLOR SYSTEM
// ============================================
cl_crosshairalpha 255 
cl_crosshairstyle 4
cl_crosshairdot 1 
cl_crosshairgap 0 
cl_crosshairsize 0
cl_crosshairthickness 1.5 
cl_fixedcrosshairgap 0
cl_crosshair_outlinethickness 0
cl_crosshair_drawoutline 0
cl_crosshaircolor 0                      // Crosshair color
cl_crosshair_recoil false                // Disable crosshair recoil animation
cl_crosshairgap_useweaponvalue false     // Disables weapon-specific adjustments to the crosshair gap
cl_crosshair_dynamic_maxdist_splitratio "0"  // Max distance ratio for dynamic split crosshair (0 = disabled)
cl_crosshair_dynamic_splitdist "5"           // Distance at which crosshair splits during movement
bind "ALT" "toggle crosshaircolor 0 1"

// ============================================
// HUD & VISUAL SETTINGS
// ============================================
r_fullscreen_gamma "3.5"                 // Setting brightness (min 1.0, default 2.2, max 4.0)

bind "TAB" "+showscores"                 // Show scoreboard
hud_scaling 1                            // Overall HUD scaling
safezonex "1"                            // Horizontal safe zone for UI elements
safezoney "1"                            // Vertical safe zone for UI elements
cl_hud_color "6"                         // HUD color scheme
cl_showloadout "1"                       // Show loadout in buy menu
cl_weapon_selection_rarity_color true    // Shows weapon name colors based on rarity/quality

hud_showtargetid "1"                            // Show target identification (red enemy name)
cl_teamcounter_playercount_instead_of_avatars false // Show avatars instead of numbers
cl_allow_animated_avatars 0                     // Disable animated player avatars
cl_hide_avatar_images 2                         // Hides all player Steam avatars except for friends
cl_show_equipped_character_for_player_avatars 0 // Disables showing the Agent model as the player avatar

// ============================================
// TEAMMATE & RADAR SETTINGS
// ============================================
cl_teamid_overhead_mode "3"              // Teammate identification mode (Pips, Name, Health, and Equipment icons through walls)
cl_teammate_colors_show "1"              // Enables showing different colors for teammates on the scoreboard

cl_radar_always_centered "1"             // Keep radar centered on player
cl_radar_icon_scale_min "0.5"            // Minimum size of radar icons
cl_radar_rotate "1"                      // Rotate radar with player orientation
cl_radar_scale "0.3"                     // Overall radar scale (Zoom level)
cl_radar_square_with_scoreboard "0"      // Square radar when scoreboard is open
cl_hud_radar_scale 1.2                   // HUD radar scale factor
cl_hud_radar_blur_background false       // Disables radar background blur
cl_hud_radar_background_alpha 1          // Radar background opacity (1 = fully visible)

bind "MWHEELUP" "cl_radar_scale 0.5"     // Zoom radar in (Max zoom)
bind "MWHEELDOWN" "cl_radar_scale 0.3"   // Zoom radar out (Default zoom)

// ============================================
// PERFORMANCE, GRAPHICS, & RAGDOLLS
// ============================================
fps_max "120"                            // Maximum FPS limit (0 = unlimited)
fps_max_ui "60"
engine_no_focus_sleep "50"               // Sets sleep time when the game is not the foreground window to reduce CPU usage

cl_disable_ragdolls "1"                  // Disables ragdoll physics for better performance
r_drawtracers_firstperson "0"            // Disables bullet tracers in first person view
r_player_visibility_mode "1"             // Sets the player visibility enhancement mode
r_show_build_info 0                      // Hide build information

// ============================================
// NETWORK & TELEMETRY
// ============================================
rate "1000000"                           // Maximum bytes per second the client can send and receive data
cl_interp_ratio "1"                      // Sets the interpolation ratio (controls lag compensation buffer size)
cl_timeout "30"                          // Connection timeout in seconds

cl_hud_telemetry_frametime_show "2"      // Shows FPS in the telemetry panel
cl_hud_telemetry_ping_show "2"           // Shows ping in the telemetry panel
cl_hud_telemetry_net_misdelivery_show "2"// Shows packet loss in the telemetry panel

// ============================================
// AUDIO & COMMUNICATION
// ============================================
bind "MOUSE4"       "+voicerecord"       // Push-to-talk voice chat

volume "1"                               // Master volume level
voice_modenable "1"                      // Enable voice chat
voice_threshold "0"                      // Voice activation threshold (Set to 0 for mic fix)
cl_player_ping_mute "0"                  // Dont mute player pings
cl_mute_enemy_team "1"                   // Mute enemy team chat
cl_mute_all_but_friends_and_party "0"    // Disables muting non-friends
cl_show_clan_in_death_notice "1"         // Shows clan tags in death notices
cl_sanitize_player_names "0"             // Sanitizing (cleaning) player names

snd_deathcamera_volume 0                 // Sets the sound volume during the death camera replay
snd_mapobjective_volume 0                // Sets the volume for map objective sounds (e.g., bomb planted)
snd_menumusic_volume 0                   // Menu music volume
snd_mvp_volume 0.1                       // MVP anthem volume
snd_roundend_volume 0                    // Round end music volume
snd_roundstart_volume 0                  // Round start sound volume
snd_tensecondwarning_volume "0"          // Ten second bomb warning volume
snd_roundaction_volume 0                 // Volume for other round action sounds
snd_mute_losefocus "0"                   // Prevents audio from muting when the game window is not active
snd_mute_mvp_music_live_players "0"      // Prevents MVP music from being muted if there are still live players
snd_mixahead "0.001"                     // Audio mix ahead time for lower latency
snd_duckerattacktime "0.5"               // Audio ducking attack time
snd_duckerreleasetime "2.5"              // Audio ducking release time
snd_duckerthreshold "0.15"               // Audio ducking threshold
snd_ducktovolume "0.55"                  // Volume level the music is reduced to when audio is ducked

// ============================================
// BUY & ECONOMY SETTINGS
// ============================================
bind "b"            "buymenu"            // Open buy menu
bind "F5"           "sellbackall"        // Sell back all purchasable equipment
bind "F1" "buy awp; buy deagle; buy vesthelm; buy hegrenade; buy flashbang; buy smokegrenade; buy molotov; buy incgrenade; buy defuser; buy taser;" 

cl_use_opens_buy_menu false              // Prevents the Use key from opening the buy menu
cl_buywheel_donate_key "0"               // Key for donation in buy wheel
cl_buywheel_nonumberpurchasing "0"       // Disables number key purchasing in the buy wheel
cl_dm_buyrandomweapons "0"               // Disables random weapon buying in deathmatch

// ============================================
// RADIO & CHAT WHEEL COMMANDS
// ============================================
bind "u"            "messagemode2"       // Team chat
bind "y"            "messagemode"        // All chat
bind "t"            "+spray_menu"        // Open spray menu
bind "MOUSE3"       "player_ping"        // Ping location for teammates
bind "kp_2"         "radio"              // Radio command group

bind "kp_7"         "+radialradio"       // Radial radio menu 1
bind "kp_8"         "+radialradio2"      // Radial radio menu 2
bind "kp_9"         "+radialradio3"      // Radial radio menu 3

bind "kp_del"       "playerchatwheel CW.Thanks #Chatwheel_thanks" // Numpad Delete: send "Thanks" chat wheel message
bind "uparrow"      "roger"              // Up arrow: send "Roger that" radio command
bind "downarrow"    "negative"           // Down arrow: send "Negative" radio command
bind "L"            "say Get Leetify"    // Spam Leetify referral in all chat
bind "kp_4"         "say_team ɪ ᴀᴍ ɢᴏɪɴɢ ᴀ.."             // Radio command group 1
bind "kp_5"         "say_team ɪ ᴀᴍ ɢᴏɪɴɢ ᴍɪᴅ.."             // Radio command group 2
bind "kp_6"         "say_team ɪ ᴀᴍ ɢᴏɪɴɢ ʙ.."             // Radio command group 3

// ============================================
// SYSTEM & MISCELLANEOUS BINDS
// ============================================
bind "`"            "toggleconsole"      // Toggle developer console
bind "ESCAPE"       "cancelselect"       // Cancel current selection
bind "F7"           "callvote starttimeout"    // Start vote for timeout
bind "F8"           "vote option1"       // Accept vote
bind "F9"           "vote option2"       // Say no to vote
bind "F3"           "toggle volume 0 1"  // Toggle volume
bind "n"            "noclip"             // Noclip
bind "m"            "teammenu"           // Open team selection menu

cl_predict_body_shot_fx "0"              // Predicts body shot impacts locally
cl_predict_head_shot_fx "0"              // Predicts headshot impacts locally
cl_predict_kill_ragdolls "0"             // Prediction of a killed enemys ragdoll locally

// ============================================
// SPECTATOR & OBSERVER SETTINGS
// ============================================
cl_obs_interp_enable "1"                 // Enables interpolation for smoother spectating
cl_observed_bot_crosshair "0"            // Hides the bot crosshair when spectating a bot
cl_show_observer_crosshair "2"           // Show crosshair when spectating players
spec_replay_autostart "1"                // Auto-starts the replay when beginning to spectate
spec_show_xray "1"                       // X-ray vision in spectator mode (shows player outlines)
spec_usenumberkeys_nobinds "0"           // Allows using number keys to switch players while spectating
cl_spec_show_bindings false              // Disables showing key bindings when spectating


// ============================================
// MISCELLANEOUS CLIENT & CACHED SETTINGS
// ============================================
con_enable "1"                           // Enable developer console
closecaption "0"                         // Disable closed captions
trusted_launch "1"                       // Enable trusted launch mode
cl_autohelp "0"                          // Enable automatic help messages
cl_disable_round_end_report "0"          // Enables the round end report
joystick "0"                             // Disables joystick support
cl_versus_intro false                      // Disables the versus mode intro sequence
mp_team_intro_time "0"
cl_scoreboard_mouse_enable_binding "+attack2" // Mouse binding for scoreboard
cl_scoreboard_survivors_always_on "1"    // Ensures the Survivors counter is always shown on the scoreboard
cl_color "3"                             // Player color preference
cl_clanid "0"                            // Steam clan ID
cl_ping_fade_deadzone "60"               // Distance where pings start to fade
cl_ping_fade_distance "300"              // Distance over which pings fade out
mapoverview_icon_scale "1.0"             // Map overview icon scaling
key_bind_version "5"                     // Key binding version for compatibility

mm_dedicated_search_maxping "60"         // Maximum ping for matchmaking servers
ui_steam_overlay_notification_position "bottomleft"                // Steam overlay notification position
ui_vanitysetting_team "ct"                                         // Vanity setting team preference
ui_vanitysetting_loadoutslot_ct "rifle4"                           // CT vanity loadout slot
ui_vanitysetting_loadoutslot_t "rifle4"                            // T vanity loadout slot
ui_mainmenu_bkgnd_movie_C2AEBB5E de_inferno                        // Main menu background map/movie (de_inferno)

// ============================================
// ENHANCED GOD MODE TOGGLE (LANA)
// ============================================
alias "godToggle_on"  "god; play sounds/ui/armsrace_level_up.vsnd; echo --- GOD MODE: ENABLED ---; alias lana godToggle_off"
alias "godToggle_off" "god; play sounds/ui/deathmatch_first_blood.vsnd; echo --- GOD MODE: DISABLED ---; alias lana godToggle_on"
alias "lana" "godToggle_on"

