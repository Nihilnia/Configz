// LOCAL PRACTICE ENVIRONMENT (pracNihil)
// ============================================
alias "pracNihil_cvars1" "sv_cheats 1; r_csgo_render_decals 0; r_drawdecals 0; bot_difficulty 5; custom_bot_difficulty 5; bot_kick; bot_stop 1; mp_limitteams 0; mp_autoteambalance 0; mp_maxmoney 65535; mp_startmoney 65535"
alias "pracNihil_cvars2" "mp_afterroundmoney 65535; mp_buytime 60000; mp_buy_anywhere 1; mp_roundtime 60; mp_roundtime_defuse 60; mp_freezetime 0"
alias "pracNihil_cvars3" "mp_ignore_round_win_conditions 1; mp_respawn_on_death_ct 1; mp_respawn_on_death_t 1; mp_warmup_end; sv_infinite_ammo 1"
alias "pracNihil_cvars4" "ammo_grenade_limit_total 6; sv_grenade_trajectory_prac_pipreview 0; sv_grenade_trajectory_prac_trailtime 8; sv_showimpacts 0"
alias "pracNihil_cvars5" "sv_regeneration_force_on 1; sv_showbullethits 1; mp_team_intro_time 0; r_csgo_render_decals false"
alias "pracNihil_cvars"  "pracNihil_cvars1; pracNihil_cvars2; pracNihil_cvars3; pracNihil_cvars4; pracNihil_cvars5; mp_restartgame 1"

alias "local_bot"     "bot_add_t; bot_place; bot_kick ct; play sounds/buttons/blip1.vsnd"
alias "local_boost"   "bot_crouch 0; play sounds/buttons/blip2.vsnd"
alias "local_crouch"  "bot_crouch 1; play sounds/buttons/button9.vsnd"
alias "local_nobots"  "bot_kick; play sounds/ui/lobby_notification_kicked.vsnd"
alias "local_rethrow" "sv_rethrow_last_grenade"
alias "local_clear"   "ent_fire smokegrenade_projectile kill; ent_fire molotov_projectile kill; ent_fire inferno kill; ent_fire flashbang_projectile kill; ent_fire hegrenade_projectile kill; stopsound; clear_msg"

alias "pracNihil_binds" "bind kp_enter local_bot; bind kp_plus local_boost; bind kp_minus local_crouch; bind pgdn local_nobots; bind ins local_rethrow; bind del local_clear; bind N noclip"

// Master Trigger
alias "pracNihil" "pracNihil_cvars; pracNihil_binds; echo --- LOCAL PRACTICE: LOADED ---; play sounds/ui/csgo_ui_contract_type2.vsnd"

// Local Impact/Nade Toggles
alias "bulletOn"  "sv_showimpacts 1; echo Bullet impacts ON; alias bullet bulletOff"
alias "bulletOff" "sv_showimpacts 0; echo Bullet impacts OFF; alias bullet bulletOn"
alias "bullet"    "bulletOn"
alias "nadeOn"    "sv_grenade_trajectory_prac_pipreview 1; echo Nade preview ON; alias nade nadeOff"
alias "nadeOff"   "sv_grenade_trajectory_prac_pipreview 0; echo Nade preview OFF; alias nade nadeOn"
